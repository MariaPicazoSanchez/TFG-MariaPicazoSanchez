name: Build MSIX and Publish to Cloudflare

on:
  workflow_call:
    inputs:
      version:
        description: "Versión de la release (debe existir ya en GitHub Releases)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (debe existir ya en GitHub Releases)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest

    steps:

      # =========================
      # CHECKOUT (necesario para install_root/MovilidadESII.ico)
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # DESCARGAR EXE DEL RELEASE
      # =========================

      - name: Download EXE installers from GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          New-Item -ItemType Directory -Path "release_assets" -Force | Out-Null

          gh release download $version `
            --pattern "MovilidadESII_ConData_${version}.exe" `
            --dir "release_assets"

          gh release download $version `
            --pattern "MovilidadESII_SinData_${version}.exe" `
            --dir "release_assets"

          Write-Host "Archivos descargados:"
          Get-ChildItem "release_assets"

      # =========================
      # LOCALIZAR MAKEAPPX Y SIGNTOOL
      # =========================

      - name: Locate makeappx.exe and signtool.exe
        id: sdk
        shell: pwsh
        run: |
          $kitsBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $makeappx = Get-ChildItem -Path $kitsBin -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          $signtool = Get-ChildItem -Path $kitsBin -Filter "signtool.exe" -Recurse |
            Where-Object { $_.FullName -match "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $makeappx) { throw "makeappx.exe no encontrado en Windows SDK" }
          if (-not $signtool)  { throw "signtool.exe no encontrado en Windows SDK" }

          Write-Host "makeappx : $makeappx"
          Write-Host "signtool : $signtool"

          "makeappx=$makeappx" | Out-File $env:GITHUB_OUTPUT -Append
          "signtool=$signtool"  | Out-File $env:GITHUB_OUTPUT -Append

      # =========================
      # GENERAR ASSETS PNG DESDE ICO
      # =========================

      - name: Generate MSIX PNG assets from ICO
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing

          $icoPath = "install_root\MovilidadESII.ico"
          $assetsDir = "msix_assets"
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null

          $icon = New-Object System.Drawing.Icon($icoPath)
          $srcBitmap = $icon.ToBitmap()

          $sizes = @{
            "Square44x44Logo.png"   = [System.Drawing.Size]::new(44,  44)
            "Square150x150Logo.png" = [System.Drawing.Size]::new(150, 150)
            "StoreLogo.png"         = [System.Drawing.Size]::new(50,  50)
          }

          foreach ($entry in $sizes.GetEnumerator()) {
            $dst = New-Object System.Drawing.Bitmap($srcBitmap, $entry.Value)
            $dst.Save("$assetsDir\$($entry.Key)", [System.Drawing.Imaging.ImageFormat]::Png)
            $dst.Dispose()
            Write-Host "Generado: $assetsDir\$($entry.Key)"
          }

          $srcBitmap.Dispose()
          $icon.Dispose()

      # =========================
      # CREAR PAQUETES MSIX
      # =========================

      - name: Create MSIX package layouts and manifests
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}" -replace '^v', ''
          # MSIX requiere formato X.Y.Z.W (cuatro componentes)
          $parts = $version -split '\.'
          while ($parts.Count -lt 4) { $parts += '0' }
          $msixVersion = $parts[0..3] -join '.'

          $publisher = "CN=ESIIAB-UCLM"

          $variants = @(
            @{ Name = "ConData"; Exe = "MovilidadESII_ConData_${{ inputs.version }}.exe" },
            @{ Name = "SinData"; Exe = "MovilidadESII_SinData_${{ inputs.version }}.exe" }
          )

          foreach ($v in $variants) {
            $layout = "msix_layout_$($v.Name)"
            New-Item -ItemType Directory -Path "$layout\Assets"    -Force | Out-Null
            New-Item -ItemType Directory -Path "$layout\installer" -Force | Out-Null

            # Copiar EXE instalador dentro del paquete
            Copy-Item "release_assets\$($v.Exe)" "$layout\installer\$($v.Exe)" -Force

            # Copiar assets gráficos
            Copy-Item "msix_assets\Square44x44Logo.png"   "$layout\Assets\" -Force
            Copy-Item "msix_assets\Square150x150Logo.png" "$layout\Assets\" -Force
            Copy-Item "msix_assets\StoreLogo.png"         "$layout\Assets\" -Force

            # Generar AppxManifest.xml (sin here-strings para compatibilidad con YAML)
            $displayName = if ($v.Name -eq "ConData") { "MovilidadESII (con datos demo)" } else { "MovilidadESII" }

            $xml = [System.Collections.Generic.List[string]]::new()
            $xml.Add('<?xml version="1.0" encoding="utf-8"?>')
            $xml.Add('<Package')
            $xml.Add('  xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"')
            $xml.Add('  xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"')
            $xml.Add('  xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities"')
            $xml.Add('  IgnorableNamespaces="uap rescap">')
            $xml.Add('')
            $xml.Add('  <Identity')
            $xml.Add("    Name=""ESIIAB.MovilidadESII.$($v.Name)""")
            $xml.Add("    Publisher=""$publisher""")
            $xml.Add("    Version=""$msixVersion""")
            $xml.Add('    ProcessorArchitecture="x64" />')
            $xml.Add('')
            $xml.Add('  <Properties>')
            $xml.Add("    <DisplayName>$displayName</DisplayName>")
            $xml.Add('    <PublisherDisplayName>ESIIAB-UCLM</PublisherDisplayName>')
            $xml.Add('    <Logo>Assets\StoreLogo.png</Logo>')
            $xml.Add('  </Properties>')
            $xml.Add('')
            $xml.Add('  <Dependencies>')
            $xml.Add('    <TargetDeviceFamily')
            $xml.Add('      Name="Windows.Desktop"')
            $xml.Add('      MinVersion="10.0.17763.0"')
            $xml.Add('      MaxVersionTested="10.0.22621.0" />')
            $xml.Add('  </Dependencies>')
            $xml.Add('')
            $xml.Add('  <Resources>')
            $xml.Add('    <Resource Language="es-ES" />')
            $xml.Add('  </Resources>')
            $xml.Add('')
            $xml.Add('  <Applications>')
            $xml.Add('    <Application')
            $xml.Add('      Id="installer"')
            $xml.Add("      Executable=""installer\$($v.Exe)""")
            $xml.Add('      EntryPoint="Windows.FullTrustApplication">')
            $xml.Add('      <uap:VisualElements')
            $xml.Add("        DisplayName=""$displayName""")
            $xml.Add('        Description="Herramienta de gestion de movilidad academica ESIIAB-UCLM"')
            $xml.Add('        BackgroundColor="transparent"')
            $xml.Add('        Square150x150Logo="Assets\Square150x150Logo.png"')
            $xml.Add('        Square44x44Logo="Assets\Square44x44Logo.png" />')
            $xml.Add('    </Application>')
            $xml.Add('  </Applications>')
            $xml.Add('')
            $xml.Add('  <Capabilities>')
            $xml.Add('    <rescap:Capability Name="runFullTrust" />')
            $xml.Add('  </Capabilities>')
            $xml.Add('')
            $xml.Add('</Package>')

            ($xml -join [System.Environment]::NewLine) |
              Set-Content "$layout\AppxManifest.xml" -Encoding UTF8
            Write-Host "Layout creado: $layout"
          }

      # =========================
      # EMPAQUETAR CON MAKEAPPX
      # =========================

      - name: Pack MSIX packages
        shell: pwsh
        run: |
          $makeappx = "${{ steps.sdk.outputs.makeappx }}"
          $version  = "${{ inputs.version }}"

          New-Item -ItemType Directory -Path "output_msix" -Force | Out-Null

          foreach ($variant in @("ConData", "SinData")) {
            $layout = "msix_layout_${variant}"
            $output = "output_msix\MovilidadESII_${variant}_${version}.msix"

            Write-Host "Empaquetando $variant..."
            & $makeappx pack /d $layout /p $output /nv
            if ($LASTEXITCODE -ne 0) { throw "makeappx falló para $variant (exit $LASTEXITCODE)" }
            Write-Host "MSIX generado: $output"
          }

      # =========================
      # CERTIFICADO DE FIRMA
      # Usa MSIX_CERT_PFX (secret base64) si existe;
      # de lo contrario genera uno autofirmado con CN=ESIIAB-UCLM.
      # =========================

      - name: Prepare signing certificate
        id: cert
        shell: pwsh
        run: |
          $certPath = "signing.pfx"
          $publisher = "CN=ESIIAB-UCLM"

          $pfxB64 = "${{ secrets.MSIX_CERT_PFX }}"
          $pfxPass = "${{ secrets.MSIX_CERT_PASSWORD }}"

          if ($pfxB64 -and $pfxB64.Length -gt 10) {
            Write-Host "Usando certificado proporcionado en secrets."
            [System.IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($pfxB64))
          } else {
            Write-Host "Generando certificado autofirmado (CN=ESIIAB-UCLM)..."
            $cert = New-SelfSignedCertificate `
              -Subject $publisher `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -KeyExportPolicy Exportable `
              -KeyUsage DigitalSignature `
              -Type CodeSigningCert `
              -NotAfter (Get-Date).AddYears(5)

            $pfxPass = "TempMsix1234!"
            Export-PfxCertificate `
              -Cert $cert `
              -FilePath $certPath `
              -Password (ConvertTo-SecureString $pfxPass -AsPlainText -Force) | Out-Null

            # Instalar en Trusted People para que signtool lo acepte
            Import-PfxCertificate `
              -FilePath $certPath `
              -CertStoreLocation "Cert:\LocalMachine\TrustedPeople" `
              -Password (ConvertTo-SecureString $pfxPass -AsPlainText -Force) | Out-Null

            Write-Host "Certificado autofirmado generado y registrado."
          }

          "pfx_path=$certPath"   | Out-File $env:GITHUB_OUTPUT -Append
          "pfx_pass=$pfxPass"    | Out-File $env:GITHUB_OUTPUT -Append

      # =========================
      # FIRMAR MSIX
      # =========================

      - name: Sign MSIX packages
        shell: pwsh
        run: |
          $signtool = "${{ steps.sdk.outputs.signtool }}"
          $pfxPath  = "${{ steps.cert.outputs.pfx_path }}"
          $pfxPass  = "${{ steps.cert.outputs.pfx_pass }}"
          $version  = "${{ inputs.version }}"

          foreach ($variant in @("ConData", "SinData")) {
            $msix = "output_msix\MovilidadESII_${variant}_${version}.msix"
            Write-Host "Firmando $msix..."
            & $signtool sign `
              /fd SHA256 `
              /p7ce DetachedSignedData `
              /f $pfxPath `
              /p $pfxPass `
              $msix
            if ($LASTEXITCODE -ne 0) { throw "signtool falló para $variant (exit $LASTEXITCODE)" }
            Write-Host "Firmado: $msix"
          }

      # =========================
      # GENERAR SHA256 DE LOS MSIX
      # =========================

      - name: Generate SHA256 hashes for MSIX
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $out = "output_msix\SHA256_MSIX.txt"

          foreach ($variant in @("ConData", "SinData")) {
            $msix = "output_msix\MovilidadESII_${variant}_${version}.msix"
            "MovilidadESII_${variant}_${version}.msix" | Out-File $out -Append -Encoding utf8
            certutil -hashfile $msix SHA256 >> $out
            "" | Out-File $out -Append -Encoding utf8
          }

      # =========================
      # SUBIR A CLOUDFLARE R2
      # =========================

      - name: Install AWS CLI
        shell: pwsh
        run: choco install awscli -y

      - name: Upload MSIX to Cloudflare R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_API_TOKEN }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          $version  = "${{ inputs.version }}"
          $endpoint = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          $bucket   = "${{ secrets.R2_BUCKET }}"

          foreach ($variant in @("ConData", "SinData")) {
            $msix = "output_msix\MovilidadESII_${variant}_${version}.msix"

            # Versión con número
            aws s3 cp $msix `
              "s3://${bucket}/MovilidadESII_${variant}_${version}.msix" `
              --endpoint-url $endpoint

            # Latest (URL permanente)
            aws s3 cp $msix `
              "s3://${bucket}/MovilidadESII_${variant}_latest.msix" `
              --endpoint-url $endpoint

            Write-Host "Subido: MovilidadESII_${variant}_${version}.msix"
          }

          # Hash
          aws s3 cp "output_msix\SHA256_MSIX.txt" `
            "s3://${bucket}/SHA256_MSIX_${version}.txt" `
            --endpoint-url $endpoint
