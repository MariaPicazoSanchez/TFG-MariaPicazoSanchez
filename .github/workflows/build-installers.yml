name: Build EXE and Installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r install_root/requirements.txt

      - name: Build wheelhouse
        shell: pwsh
        run: |
          mkdir install_root/wheelhouse -Force
          pip wheel -r install_root/requirements.txt -w install_root/wheelhouse

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes

      # =========================
      # BUILD VERSION CON DATOS
      # =========================

      - name: Build EXE (demo data)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --noconsole `
            --clean `
            --noconfirm `
            --icon=install_root/MovilidadESII.ico `
            --name MovilidadESII `
            launcher_system.py

      - name: Create installer (demo data)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Clean build folders
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction Ignore
          Remove-Item -Recurse -Force build -ErrorAction Ignore
          Remove-Item *.spec -ErrorAction Ignore

      # =========================
      # BUILD VERSION SIN DATOS
      # =========================

      - name: Build EXE (no demo data)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --noconsole `
            --clean `
            --noconfirm `
            --icon=install_root/MovilidadESII.ico `
            --name MovilidadESII `
            launcher_system_sindata.py

      - name: Create installer (no demo data)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_sindata.iss

      # =========================
      # DEBUG (ver que existen)
      # =========================

      - name: Check output folder
        shell: pwsh
        run: |
          dir output

      # =========================
      # ARTIFACTS (opcional)
      # =========================

      - name: Upload installer demo
        uses: actions/upload-artifact@v4
        with:
          name: installer-demo
          path: output/MovilidadESII_Installer_ConData.exe

      - name: Upload installer clean
        uses: actions/upload-artifact@v4
        with:
          name: installer-clean
          path: output/MovilidadESII_Installer_SinData.exe
          
      # =========================
      # FIRMA DE EJECUTABLES
      # =========================
      - name: Decode certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CERTIFICATE_PFX }}")
          [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", $bytes)

      - name: Sign installers
        shell: pwsh
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          $password = "${{ secrets.CERTIFICATE_PASSWORD }}"
          $timestamp = "http://timestamp.digicert.com"

          & $signtool sign -f "$env:TEMP\cert.pfx" -p $password -t $timestamp -fd SHA256 "output\MovilidadESII_Installer_ConData.exe"
          & $signtool sign -f "$env:TEMP\cert.pfx" -p $password -t $timestamp -fd SHA256 "output\MovilidadESII_Installer_SinData.exe"

      - name: Clean certificate
        shell: pwsh
        run: Remove-Item "$env:TEMP\cert.pfx" -Force
        
      # =========================
      # RELEASE
      # =========================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MovilidadESII Build ${{ github.run_number }}
          files: |
            output/MovilidadESII_Installer_ConData.exe
            output/MovilidadESII_Installer_SinData.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
