name: Build EXE and Installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # PYTHON SETUP
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r install_root/requirements.txt

      # =========================
      # BUILD WHEELS
      # =========================

      - name: Build wheelhouse
        shell: pwsh
        run: |
          mkdir install_root/wheelhouse -Force
          pip wheel -r install_root/requirements.txt -w install_root/wheelhouse

      # =========================
      # INSTALL INNO SETUP
      # =========================

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes

      # =========================
      # BUILD VERSION CON DATOS
      # =========================

      - name: Build EXE (demo data)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --noconsole `
            --clean `
            --noconfirm `
            --icon=install_root/MovilidadESII.ico `
            --name MovilidadESII `
            launcher_system.py

      - name: Create installer (demo data)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Clean build folders
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction Ignore
          Remove-Item -Recurse -Force build -ErrorAction Ignore
          Remove-Item *.spec -ErrorAction Ignore

      # =========================
      # BUILD VERSION SIN DATOS
      # =========================

      - name: Build EXE (no demo data)
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --noconsole `
            --clean `
            --noconfirm `
            --icon=install_root/MovilidadESII.ico `
            --name MovilidadESII `
            launcher_system_sindata.py

      - name: Create installer (no demo data)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_sindata.iss

      # =========================
      # DEBUG
      # =========================

      - name: Check output folder
        shell: pwsh
        run: dir output

      # =========================
      # FIRMA DE EJECUTABLES
      # =========================

      - name: Decode certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CERTIFICATE_PFX }}")
          [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx", $bytes)

      - name: Sign installers
        shell: pwsh
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "signtool found at: $signtool"
          $password = "${{ secrets.CERTIFICATE_PASSWORD }}"

          & $signtool sign `
            -f "$env:TEMP\cert.pfx" `
            -p $password `
            -fd SHA256 `
            -tr http://timestamp.digicert.com `
            -td SHA256 `
            "output\MovilidadESII_Installer_ConData.exe"

          & $signtool sign `
            -f "$env:TEMP\cert.pfx" `
            -p $password `
            -fd SHA256 `
            -tr http://timestamp.digicert.com `
            -td SHA256 `
            "output\MovilidadESII_Installer_SinData.exe"

      - name: Clean certificate
        shell: pwsh
        run: |
          if (Test-Path "$env:TEMP\cert.pfx") {
            Remove-Item "$env:TEMP\cert.pfx" -Force
          }

      # =========================
      # GENERATE HASH
      # =========================

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          certutil -hashfile output\MovilidadESII_Installer_ConData.exe SHA256 > output\SHA256.txt
          certutil -hashfile output\MovilidadESII_Installer_SinData.exe SHA256 >> output\SHA256.txt

      # =========================
      # ARTIFACTS
      # =========================

      - name: Upload installer demo
        uses: actions/upload-artifact@v4
        with:
          name: installer-demo
          path: output/MovilidadESII_Installer_ConData.exe

      - name: Upload installer clean
        uses: actions/upload-artifact@v4
        with:
          name: installer-clean
          path: output/MovilidadESII_Installer_SinData.exe

      # =========================
      # RELEASE
      # =========================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MovilidadESII Build ${{ github.run_number }}
          files: |
            output/MovilidadESII_Installer_ConData.exe
            output/MovilidadESII_Installer_SinData.exe
            output/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
