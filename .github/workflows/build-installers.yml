name: Build EXE and Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # PYTHON SETUP
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r install_root/requirements.txt

      # =========================
      # BUILD WHEELS
      # =========================

      - name: Build wheelhouse
        shell: pwsh
        run: |
          mkdir install_root/wheelhouse -Force
          pip wheel -r install_root/requirements.txt -w install_root/wheelhouse

      # =========================
      # INSTALL INNO SETUP
      # =========================

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes

      # =========================
      # BUILD EXE (shared)
      # =========================

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onedir `
            --noconsole `
            --clean `
            --noconfirm `
            --icon=install_root/MovilidadESII.ico `
            --name MovilidadESII `
            launcher_system.py

      # =========================
      # BUILD INSTALLERS
      # =========================

      - name: Create installer (con datos)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create installer (sin datos)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_sindata.iss

      - name: Clean build folders
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist -ErrorAction Ignore
          Remove-Item -Recurse -Force build -ErrorAction Ignore
          Remove-Item *.spec -ErrorAction Ignore

      # =========================
      # RENOMBRAR EXE CON VERSIÓN
      # =========================

      - name: Renombrar instaladores con versión
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          Copy-Item "output\MovilidadESII_Installer_ConData.exe" `
                    "output\MovilidadESII_ConData_${version}.exe" -Force
          Copy-Item "output\MovilidadESII_Installer_SinData.exe" `
                    "output\MovilidadESII_SinData_${version}.exe" -Force

      # =========================
      # EMPAQUETAR EN ZIP
      # =========================

      - name: Empaquetar instaladores en ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          Compress-Archive `
            -Path "output\MovilidadESII_ConData_${version}.exe" `
            -DestinationPath "output\MovilidadESII_ConData_${version}.zip" `
            -Force
          Compress-Archive `
            -Path "output\MovilidadESII_SinData_${version}.exe" `
            -DestinationPath "output\MovilidadESII_SinData_${version}.zip" `
            -Force

      # =========================
      # GENERATE HASH
      # =========================

      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $out = "output\SHA256.txt"
          "MovilidadESII_ConData_${version}.exe" | Out-File $out -Encoding utf8
          certutil -hashfile "output\MovilidadESII_ConData_${version}.exe" SHA256 >> $out
          "" | Out-File $out -Append -Encoding utf8
          "MovilidadESII_SinData_${version}.exe" | Out-File $out -Append -Encoding utf8
          certutil -hashfile "output\MovilidadESII_SinData_${version}.exe" SHA256 >> $out
          "" | Out-File $out -Append -Encoding utf8
          "MovilidadESII_ConData_${version}.zip" | Out-File $out -Append -Encoding utf8
          certutil -hashfile "output\MovilidadESII_ConData_${version}.zip" SHA256 >> $out
          "" | Out-File $out -Append -Encoding utf8
          "MovilidadESII_SinData_${version}.zip" | Out-File $out -Append -Encoding utf8
          certutil -hashfile "output\MovilidadESII_SinData_${version}.zip" SHA256 >> $out

      # =========================
      # ARTIFACTS
      # =========================

      - name: Upload artifact (con datos)
        uses: actions/upload-artifact@v4
        with:
          name: MovilidadESII-ConData-${{ inputs.version }}
          path: output/MovilidadESII_ConData_${{ inputs.version }}.zip

      - name: Upload artifact (sin datos)
        uses: actions/upload-artifact@v4
        with:
          name: MovilidadESII-SinData-${{ inputs.version }}
          path: output/MovilidadESII_SinData_${{ inputs.version }}.zip

      # =========================
      # RELEASE
      # =========================

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}" -replace '^v', ''
          $content = Get-Content CHANGELOG.md -Raw
          # Extrae el bloque entre ## [X.Y.Z] y el siguiente ##
          if ($content -match "(?s)## \[$version\][^\n]*\n(.*?)(?=\n## \[)") {
            $notes = $Matches[1].Trim()
          } else {
            $notes = "See CHANGELOG.md for details."
          }
          # Escribe en variable de entorno multilínea
          "RELEASE_NOTES<<EOF" | Out-File $env:GITHUB_OUTPUT -Append
          $notes | Out-File $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: MovilidadESII ${{ inputs.version }}
          body: ${{ steps.changelog.outputs.RELEASE_NOTES }}
          files: |
            output/MovilidadESII_ConData_${{ inputs.version }}.exe
            output/MovilidadESII_SinData_${{ inputs.version }}.exe
            output/MovilidadESII_ConData_${{ inputs.version }}.zip
            output/MovilidadESII_SinData_${{ inputs.version }}.zip
            output/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================
      # PUBLICAR INSTALADORES PARA CLOUDFLARE
      # =========================

      - name: Install AWS CLI
        shell: pwsh
        run: |
          choco install awscli -y

      - name: Upload to Cloudflare R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_API_TOKEN }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          $version = "${{ inputs.version }}"
          $endpoint = "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          # Versión con número
          aws s3 cp "output/MovilidadESII_ConData_${version}.exe" `
            "s3://${{ secrets.R2_BUCKET }}/MovilidadESII_ConData_${version}.exe" `
            --endpoint-url $endpoint

          aws s3 cp "output/MovilidadESII_SinData_${version}.exe" `
            "s3://${{ secrets.R2_BUCKET }}/MovilidadESII_SinData_${version}.exe" `
            --endpoint-url $endpoint

          # Latest (URL permanente para la Microsoft Store)
          aws s3 cp "output/MovilidadESII_ConData_${version}.exe" `
            "s3://${{ secrets.R2_BUCKET }}/MovilidadESII_ConData_latest.exe" `
            --endpoint-url $endpoint

          aws s3 cp "output/MovilidadESII_SinData_${version}.exe" `
            "s3://${{ secrets.R2_BUCKET }}/MovilidadESII_SinData_latest.exe" `
            --endpoint-url $endpoint